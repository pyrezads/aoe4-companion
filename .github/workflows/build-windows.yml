# Builds the Windows installer (AoE4-Coach-Setup-x.y.z.exe) on GitHub's Windows machines.
#
# Every push to main: runs the tests, packs the Python screen reader (aoe4-core.exe),
# checks the packed copy really starts and reads a screenshot, then builds the installer.
# Download it from the run's "Artifacts" section.
#
# Publishing a release, which installed apps update to by themselves:
#   1. set "version" in package.json (e.g. 0.2.0) and push
#   2. on GitHub: Actions > Build Windows app > Run workflow, tick "Publish", Run
#      (or push a tag: git tag v0.2.0 && git push --tags). The release is tagged v<version>.
#
# Nobody needs Node or Python on their PC: the installer carries everything.

name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish as a release (installed apps update to it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8      # what the app sets when it starts the core
        run: |
          pip install -r requirements.txt
          fail=0
          for t in test_coach.py test_core.py test_review.py test_history.py test_sizes.py test_builds.py \
                   test_production_math.py test_gamelog.py test_gamelog_core.py; do
            if python "$t" > test_out.txt 2>&1; then echo "ok $t"; else
              fail=1
              # the failing output as an annotation, readable with the API (gh run view) even when logs aren't
              msg=$(tail -n 30 test_out.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=$t failed::$msg"
              cat test_out.txt
            fi
          done
          exit $fail

      - name: Pack the screen reader (aoe4-core.exe)
        run: |
          pip install pyinstaller==6.22.3
          python -m PyInstaller packaging/aoe4-core.spec --distpath dist-core --workpath build-core --noconfirm

      - name: Check the packed screen reader runs
        run: python packaging/smoke_core.py dist-core/aoe4-core/aoe4-core.exe

      - name: Make the runner's screen 1920x1080 (it starts at 1024x768)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "Screen now: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Size

      - name: Check the game-window capture (stand-in game window)
        shell: bash
        run: |
          python packaging/capture_test.py dist-core/aoe4-core/aoe4-core.exe || true
          grep -qx OK capture_result.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check pinning to the game window (stand-in window)
        shell: bash
        run: |
          npx electron packaging/pin_test.js || true
          grep -qx OK pin_result.txt

      - name: Check the whole app on Windows (coach strip pinned to a stand-in game)
        shell: bash
        env:
          AOE4_PYTHON: python
        run: |
          timeout 300 npx electron tests/e2e_app.js 2>&1 | grep -E "PASS|FAIL|crashed" || true
          grep -qx OK e2e_result.txt

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.publish != 'true' }}
        run: npx electron-builder --win nsis --publish never

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      # Build first, then upload with GitHub's own tool. A release that exists but is missing
      # files (an upload cut short) is completed; a complete one is never overwritten.
      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          have=$(gh release view "v$v" --json assets -q '[.assets[].name] | join(" ")' 2>/dev/null || echo "none")
          if [[ "$have" == *latest.yml* ]]; then echo "::error::v$v is already released: raise the version in package.json first"; exit 1; fi
          npx electron-builder --win nsis --publish never
          ls -la dist
          files=(dist/*.exe dist/latest.yml dist/*.blockmap)
          if [ "$have" = "none" ]; then
            gh release create "v$v" "${files[@]}" --target "$GITHUB_SHA" --title "AoE4 Coach $v" --notes "Installed apps update to this by themselves. New install: download AoE4-Coach-Setup-$v.exe."
          else
            gh release upload "v$v" "${files[@]}" --clobber
          fi
          gh release view "v$v" --json assets -q '"::notice::v'"$v"' files: " + ([.assets[].name] | join(", "))'


      - uses: actions/upload-artifact@v5
        with:
          name: AoE4-Coach-installer
          path: dist/*.exe
