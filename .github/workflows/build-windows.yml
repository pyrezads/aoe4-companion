# Builds the Windows installer (AoE4-Coach-Setup-x.y.z.exe) on GitHub's Windows machines.
#
# Every push to main: runs the tests, packs the Python screen reader (aoe4-core.exe),
# checks the packed copy really starts and reads a screenshot, then builds the installer.
# Download it from the run's "Artifacts" section.
#
# A version tag publishes a release that installed apps update to by themselves:
#   1. set "version" in package.json (e.g. 0.2.0) and push
#   2. git tag v0.2.0 && git push --tags
#
# Nobody needs Node or Python on their PC: the installer carries everything.

name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          pip install -r requirements.txt
          python test_coach.py
          python test_core.py
          python test_builds.py
          python test_production_math.py

      - name: Pack the screen reader (aoe4-core.exe)
        run: |
          pip install pyinstaller==6.22.3
          python -m PyInstaller packaging/aoe4-core.spec --distpath dist-core --workpath build-core --noconfirm

      - name: Check the packed screen reader runs
        run: python packaging/smoke_core.py dist-core/aoe4-core/aoe4-core.exe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check pinning to the game window (stand-in window)
        shell: bash
        run: |
          npx electron packaging/pin_test.js || true
          grep -qx OK pin_result.txt

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --publish never

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: AoE4-Coach-installer
          path: dist/*.exe
